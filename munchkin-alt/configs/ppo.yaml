# PPO (clipped objective, GAE, action masking).
arch: pairwise          # pairwise | mlp
hidden: 128
value_hidden: 256
gamma: 0.99
gae_lambda: 0.95
lr: 0.0003
clip: 0.2
vf_coef: 0.5
ent_coef_start: 0.02
ent_coef_end: 0.002
max_grad_norm: 0.5
target_kl: 0.03
epochs: 10
minibatch: 256
n_envs: 8
n_steps: 256
reward_scale: 0.1
total_steps: 1500000
val_every_updates: 25
val_seeds_per_scenario: 4
